name: COSMIC-HW-12 HMAC KAT

on:
  push:
    branches:
      - "research/cosmic-hw-12-candidate"
  pull_request:
    paths:
      - "rtl/cosmic_hw_12_hmac.v"
      - "rtl/cosmic_hw_12_hmac_safe.v"
      - "benchmarks/run_cosmic_hw_12_hmac_kat.py"
      - ".github/workflows/cosmic_hw_12_hmac_kat.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  hmac-kat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Icarus and pytest
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          python -m pip install --quiet pytest
          iverilog -V | head -n 2
      - name: Revalidate frozen HW-12 prereg semantics
        run: PYTHONPATH=. python -m pytest -q tests/test_cosmic_hw_12_prereg.py -k 'not candidate_files_absent_on_prereg_head'
      - name: Reproduce frozen HW-12 HMAC oracle
        run: PYTHONPATH=. python benchmarks/cosmic_hw_12_oracle.py
      - name: Execute 446-vector RTL HMAC gate
        run: PYTHONPATH=. python benchmarks/run_cosmic_hw_12_hmac_kat.py
