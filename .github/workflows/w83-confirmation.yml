name: W8.3 Confirmation

on:
  pull_request:
    branches:
      - agent/morphos-w83-history-pair-handoff
  workflow_dispatch:

jobs:
  confirm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run W8.3 unit contract
        run: python -m unittest tests.test_witness_history_pair -v
      - name: Run frozen W8.3 fresh confirmation
        run: python -m benchmarks.run_w83_confirmation
