name: COSMIC-HW-08 SHA KAT

on:
  push:
    branches:
      - "research/cosmic-hw-08-candidate"
  pull_request:
    paths:
      - "rtl/cosmic_hw_08_sha256.v"
      - "benchmarks/cosmic_hw_08_kat.py"
      - "benchmarks/run_cosmic_hw_08_sha_kat.py"
      - ".github/workflows/cosmic_hw_08_sha_kat.yml"
  workflow_dispatch:

jobs:
  sha-kat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Icarus
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          iverilog -V | head -n 2
      - name: Verify frozen KAT boundary
        run: |
          PYTHONPATH=. python - <<'PY'
          from benchmarks.cosmic_hw_08_kat import kat_fingerprint
          assert kat_fingerprint()=="3919530f4fb110bb453429fb50d8f6c6f664cf9506f5391a4b3a1e9fac5d5bbd"
          print("frozen KAT fingerprint PASS")
          PY
      - name: Execute SHA-256 RTL KAT
        run: PYTHONPATH=. python benchmarks/run_cosmic_hw_08_sha_kat.py
