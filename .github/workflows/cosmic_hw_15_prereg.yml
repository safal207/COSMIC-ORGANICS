name: COSMIC-HW-15 Prereg

on:
  push:
    branches:
      - "research/cosmic-hw-15-prereg"
  pull_request:
    paths:
      - "benchmarks/cosmic_hw_15_manifest.json"
      - "tests/test_cosmic_hw_15_prereg.py"
      - ".github/workflows/cosmic_hw_15_prereg.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prereg:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install frozen open FPGA toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            yosys=0.33-5build2 \
            iverilog=12.0-2build2 \
            nextpnr-ecp5=0.6-3build5 \
            fpga-trellis=1.4-2build4
          python -m pip install --quiet pytest
          yosys -V
          iverilog -V | head -n 2
          nextpnr-ecp5 --version
          ecppack --help 2>&1 | head -n 2 || true

      - name: Run frozen HW-15 prereg assertions
        run: PYTHONPATH=. python -m pytest -q tests/test_cosmic_hw_15_prereg.py

      - name: Verify the frozen Yosys DSP-free mapping boundary
        run: |
          yosys -p 'help synth_ecp5' > /tmp/synth_ecp5_help.txt
          grep -q -- '-nodsp' /tmp/synth_ecp5_help.txt

          cat > /tmp/hw15_mul.v <<'VERILOG'
          module hw15_mul(
              input  wire       clk,
              input  wire       reset,
              output reg  [7:0] status
          );
              reg signed [17:0] a;
              reg signed [17:0] b;
              reg signed [35:0] product;

              always @(posedge clk) begin
                  if (reset) begin
                      a <= 18'sh12345;
                      b <= -18'sh05678;
                      product <= 36'sd0;
                      status <= 8'h15;
                  end else begin
                      a <= {a[16:0], a[17] ^ a[10] ^ a[7] ^ a[0]};
                      b <= {b[16:0], b[17] ^ b[11] ^ b[5] ^ b[0]};
                      product <= a * b;
                      status <= product[7:0] ^ product[15:8] ^
                                product[23:16] ^ product[31:24] ^
                                {4'b0, product[35:32]};
                  end
              end
          endmodule
          VERILOG

          yosys -q -p 'read_verilog -sv /tmp/hw15_mul.v; hierarchy -check -top hw15_mul; synth_ecp5 -top hw15_mul; write_json /tmp/hw15_mul_auto.json'
          yosys -q -p 'read_verilog -sv /tmp/hw15_mul.v; hierarchy -check -top hw15_mul; synth_ecp5 -nodsp -top hw15_mul; write_json /tmp/hw15_mul_nodsp.json'

          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          def counts(path: str) -> Counter:
              data=json.loads(Path(path).read_text())
              cells=data['modules']['hw15_mul'].get('cells', {})
              return Counter(cell['type'] for cell in cells.values())

          auto=counts('/tmp/hw15_mul_auto.json')
          nodsp=counts('/tmp/hw15_mul_nodsp.json')
          assert auto['MULT18X18D'] >= 1, auto
          assert nodsp['MULT18X18D'] == 0, nodsp
          assert nodsp['TRELLIS_FF'] > 0, nodsp
          assert nodsp['LUT4'] + nodsp['CCU2C'] > 0, nodsp
          print('COSMIC_HW15_NODSP_TOOLCHAIN PASS')
          print('AUTO_DSP', dict(sorted(auto.items())))
          print('NODSP', dict(sorted(nodsp.items())))
          PY

      - name: Smoke the exact ECP5-85F route and pack path with the NODSP toy
        run: |
          nextpnr-ecp5 --85k --package CABGA381 --speed 8 \
            --json /tmp/hw15_mul_nodsp.json \
            --textcfg /tmp/hw15_mul_nodsp.config \
            --freq 10 --seed 1501 2>&1 | tee /tmp/hw15_mul_nodsp_nextpnr.log
          ecppack /tmp/hw15_mul_nodsp.config /tmp/hw15_mul_nodsp.bit
          test -s /tmp/hw15_mul_nodsp.bit
          grep -q 'Max frequency for clock' /tmp/hw15_mul_nodsp_nextpnr.log
          echo 'COSMIC_HW15_NODSP_ROUTE_PACK PASS target=LFE5U-85F-8BG381C seed=1501 freq=10MHz'
