name: PB-TRANSITION-01 MORPHOS adapter

on:
  pull_request:
    paths:
      - "benchmarks/pb_transition_01.py"
      - "benchmarks/run_w85_opportunity_continuation.py"
      - "benchmarks/w85_opportunity_continuation_manifest.json"
      - "morphos/**"
      - ".github/workflows/pb_transition_01.yml"
  workflow_dispatch:

jobs:
  pb-transition-01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute frozen MORPHOS transition benchmark
        run: |
          python -m benchmarks.pb_transition_01 > /tmp/pb_transition_01.json
          python -m json.tool /tmp/pb_transition_01.json
      - name: Validate machine-readable contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/pb_transition_01.json').read_text())
          assert report['benchmark_id'] == 'PB-TRANSITION-01'
          assert report['status'] == 'executed'
          assert report['frozen_provenance']['mechanism_blob_matches_frozen'] is True
          assert report['proof']['decision'] == 'TRANSFER_PASS'
          assert report['utility']['predecessor_failures'] == 2
          assert report['utility']['causal_rescues'] == 2
          assert report['utility']['causal_rescue_rate'] == 1.0
          assert report['utility']['minimum_exact_recovery_at_8'] == 1.0
          assert report['utility']['minimum_exact_recovery_at_12'] == 1.0
          assert report['utility']['previous_successes_regressed'] == 0
          assert report['cost_speed']['trials_per_sec'] > 0
          PY
