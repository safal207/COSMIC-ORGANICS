name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run MORPHOS tests
        run: python -m unittest discover -s tests -v
      - name: Run deterministic demo
        run: python -m morphos.simulator > morphos-demo.json
      - name: Validate evidence envelope
        run: |
          python - <<'PY'
          import json
          data = json.load(open("morphos-demo.json", encoding="utf-8"))
          assert data["protocol_version"] == "MORPHOS-0/0.1"
          assert len(data["state_digest"]) == 64
          assert "metrics" in data
          print(data["state_digest"])
          PY
      - name: Reproduce P1 baseline result
        run: python -m benchmarks.run --output /tmp/p1-result.json
      - name: Verify committed P1 baseline result
        run: cmp /tmp/p1-result.json results/p1-baseline-v0.1.json
      - name: Reproduce P1 temporal result
        run: python -m benchmarks.run_temporal --output /tmp/p1-temporal.json
      - name: Verify committed P1 temporal result
        run: cmp /tmp/p1-temporal.json results/p1-temporal-v0.1.json
      - name: Reproduce P1 robustness map
        run: python -m benchmarks.run_robustness --output /tmp/p1-robustness.json
      - name: Verify committed P1 robustness result
        run: cmp /tmp/p1-robustness.json results/p1-robustness-v0.1.json
      - name: Reproduce P1 external baseline result
        run: python -m benchmarks.run_external_baselines --output /tmp/p1-external-baselines.json
      - name: Verify committed P1 external baseline result
        run: cmp /tmp/p1-external-baselines.json results/p1-external-baselines-v0.1.json
      - name: Reproduce P1 state capacity result
        run: python -m benchmarks.run_state_capacity --output /tmp/p1-state-capacity.json
      - name: Verify committed P1 state capacity result
        run: cmp /tmp/p1-state-capacity.json results/p1-state-capacity-v0.1.json
      - name: Reproduce P1 T2 repair result
        run: python -m benchmarks.run_t2_repair --output /tmp/p1-t2-repair.json
      - name: Verify committed P1 T2 repair result
        run: cmp /tmp/p1-t2-repair.json results/p1-t2-repair-v0.1.json
      - name: Reproduce P1 2D heterogeneous result
        run: python -m benchmarks.run_2d_heterogeneous --output /tmp/p1-2d-heterogeneous.json
      - name: Verify committed P1 2D heterogeneous result
        run: cmp /tmp/p1-2d-heterogeneous.json results/p1-2d-heterogeneous-v0.1.json
      - name: Reproduce P1 Generalization Gate
        run: python -m benchmarks.run_generalization --output /tmp/p1-generalization-full.json
      - name: Render Generalization Gate evidence summary
        run: python -m benchmarks.render_generalization_summary --output /tmp/p1-generalization-summary.json
      - name: Verify committed Generalization Gate summary
        run: cmp /tmp/p1-generalization-summary.json results/p1-generalization-v0.1-summary.json
      - name: Reproduce P1 MORPHOS-S1 scale-aware result
        run: python -m benchmarks.run_scale_aware --output /tmp/p1-scale-aware.json
      - name: Verify committed P1 MORPHOS-S1 scale-aware result
        run: cmp /tmp/p1-scale-aware.json results/p1-scale-aware-v0.1.json
      - name: Reproduce P1 MORPHOS-S2 hierarchical result
        run: python -m benchmarks.run_hierarchical --output /tmp/p1-hierarchical-full.json
      - name: Render MORPHOS-S2 hierarchical evidence summary
        run: python -m benchmarks.render_hierarchical_summary --report /tmp/p1-hierarchical-full.json --output /tmp/p1-hierarchical-summary.json
      - name: Verify committed MORPHOS-S2 hierarchical summary
        run: |
          cat /tmp/p1-hierarchical-summary.json
          cmp /tmp/p1-hierarchical-summary.json results/p1-hierarchical-v0.1-summary.json
