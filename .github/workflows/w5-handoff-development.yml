name: W5 Handoff Development

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run W5 handoff unit tests
        run: python -m unittest tests.test_witness_handoff -v
      - name: Run frozen W5 handoff development probe
        run: python -m benchmarks.probe_witness_handoff
