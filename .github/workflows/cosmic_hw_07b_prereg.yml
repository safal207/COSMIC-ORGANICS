name: COSMIC-HW-07B Prereg Gate

on:
  push:
    branches:
      - "research/cosmic-hw-07b-prereg"
  pull_request:
    paths:
      - "benchmarks/cosmic_hw_07b_manifest.json"
      - "tests/test_cosmic_hw_07b_prereg.py"
      - ".github/workflows/cosmic_hw_07b_prereg.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  prereg:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependency
        run: python -m pip install --quiet pytest

      - name: Run frozen HW-07B prereg gate
        run: python -m pytest tests/test_cosmic_hw_07b_prereg.py -q

      - name: Print frozen boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('benchmarks/cosmic_hw_07b_manifest.json').read_text())
          c=m['frozen_control']['official_hw07']
          print('COSMIC_HW_07B_PREREG_PASS')
          print('parent=',m['parent_hw07_head'])
          print('stress=',m['stress_fingerprint'])
          print('control_stalls=',c['backpressure_stalls'])
          print('control_mapping=',c['sparse_receipt_mapping'])
          print('handoff=',m['hw08_handoff'])
          PY

      - name: Publish prereg PASS to issue 76
        if: success() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## COSMIC-HW-07B prereg PASS — Python ${{ matrix.python-version }}\n\nExact prereg head: \`${context.sha}\`\n\n- frozen HW-07 control evidence: PASS\n- F4-flat / F4-hier / F2-hier / F1-hier candidate set: PASS\n- hierarchical 8x8 selector definition: PASS\n- exact stress fingerprint reuse: PASS\n- F4_HIER identical-stall gate: PASS\n- HW-08 low-activity handoff rule frozen: PASS\n- synthetic combined score forbidden: PASS\n- SHA/Merkle still deferred: PASS\n- HW-07B candidate RTL absent: PASS`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 76,
              body
            });

      - name: Publish prereg RED to issue 76
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## COSMIC-HW-07B prereg RED — Python ${{ matrix.python-version }}\n\nExact prereg head: \`${context.sha}\`\n\nThe frozen frontier/handoff gate failed before any valid candidate result. Do not create or interpret candidate RTL until this gate is corrected without changing the scientific intent.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 76,
              body
            });
