name: W6 Post Endpoint

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Split W6 rebound from collateral after endpoint
        run: python -m benchmarks.diagnose_w6_post_endpoint
