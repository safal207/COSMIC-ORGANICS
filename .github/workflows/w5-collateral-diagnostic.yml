name: W5 Collateral Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Classify unresolved W5 collateral failures
        run: python -m benchmarks.diagnose_w5_collateral_boundary
