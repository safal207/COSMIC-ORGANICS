name: COSMIC Verified Incident Demo

on:
  pull_request:
    paths:
      - 'demos/**'
      - 'tests/test_verified_incident_map.py'
      - 'morphos/cosmic_kernel.py'
      - 'morphos/dag_parent_commit.py'
      - 'morphos/proof_controls_v02.py'
      - 'morphos/sparse_scheduler.py'
      - '.github/workflows/cosmic_verified_incident_demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-demo:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependency
        run: python -m pip install --quiet pytest

      - name: Run focused application test
        run: PYTHONPATH=. python -m pytest -q tests/test_verified_incident_map.py

      - name: Emit deterministic application evidence
        run: |
          PYTHONPATH=. python demos/verified_incident_map.py --compact > /tmp/cosmic_verified_incident_demo.json
          python -m json.tool /tmp/cosmic_verified_incident_demo.json

      - name: Validate exported evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/cosmic_verified_incident_demo.json').read_text())
          assert result['demo_id'] == 'COSMIC-VERIFIED-INCIDENT-MAP/v0.1'
          assert result['status'] == 'PASS'
          assert all(result['correctness'].values())
          assert result['result']['completed_transitions'] > 0
          assert result['result']['audited_transitions'] == result['result']['completed_transitions']
          assert result['execution_work']['sparse_node_evaluation_reduction_fraction'] >= 0.50
          assert len(result['evidence']['proof_sha256']) == 64
          print('COSMIC verified incident demo contract PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: cosmic-verified-incident-demo-${{ matrix.python-version }}
          path: /tmp/cosmic_verified_incident_demo.json
