name: COSMIC-HW-15 Candidate NODSP Frontier

on:
  push:
    branches:
      - "research/cosmic-hw-15-candidate"
  pull_request:
    paths:
      - "benchmarks/cosmic_hw_15_candidate.py"
      - "benchmarks/cosmic_hw_15_manifest.json"
      - "tests/test_cosmic_hw_15_prereg.py"
      - ".github/workflows/cosmic_hw_15_candidate.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen open FPGA toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            yosys=0.33-5build2 \
            iverilog=12.0-2build2 \
            nextpnr-ecp5=0.6-3build5 \
            fpga-trellis=1.4-2build4
          python -m pip install --quiet pytest
          yosys -V
          iverilog -V | head -n 2
          nextpnr-ecp5 --version
          ecppack --help 2>&1 | head -n 2 || true

      - name: Revalidate frozen HW-15 prereg semantics
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_cosmic_hw_15_prereg.py \
            -k 'not candidate_files_absent_on_prereg_head'
          yosys -p 'help synth_ecp5' | grep -q -- '-nodsp'

      - name: Revalidate exact CORE_LITE receipt semantics
        run: |
          python -m pytest \
            tests/test_cosmic_hw_06_vectors.py \
            tests/test_cosmic_hw_06_phase1.py \
            tests/test_cosmic_hw_07_candidate.py -q
          PYTHONPATH=. python benchmarks/cosmic_hw_07_candidate.py --json \
            > /tmp/cosmic_hw_07_result.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/cosmic_hw_07_result.json').read_text())
          assert r['decision']=='SPARSE_PLUS_RECEIPT_PARETO_SUPPORTED'
          assert r['functional_gate'] is True
          assert r['simulation']['receipts_emitted']==41144
          assert r['receipt']['missing_receipts']==0
          assert r['receipt']['duplicate_receipts']==0
          assert r['receipt']['phantom_receipts']==0
          assert r['receipt']['field_match_fraction']==1.0
          assert r['execution_semantic_contamination']==0
          print('HW-15 inherited CORE semantic gate PASS')
          PY

      - name: Revalidate exact PROOF_EDGE SHA commitment semantics
        run: |
          PYTHONPATH=. python benchmarks/run_cosmic_hw_08_sha_kat.py
          PYTHONPATH=. python benchmarks/cosmic_hw_08_candidate.py --json \
            > /tmp/cosmic_hw_08_result.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/cosmic_hw_08_result.json').read_text())
          assert r['decision']=='SHA256_COMMITMENT_COST_MEASURED'
          assert r['commitments']['real_receipts_committed']==41144
          assert r['commitments']['digest_match_fraction']==1.0
          assert r['commitments']['digest_sequence_match_fraction']==1.0
          assert r['commitments']['real_receipt_commit_coverage_fraction']==1.0
          assert r['merkle_present'] is False
          print('HW-15 inherited PROOF_EDGE semantic gate PASS')
          PY

      - name: Execute frozen HW-15 DSP-free physical frontier
        run: |
          rm -rf /tmp/cosmic-hw-15-evidence
          mkdir -p /tmp/cosmic-hw-15-evidence
          PYTHONPATH=. python benchmarks/cosmic_hw_15_candidate.py \
            --json --output-dir /tmp/cosmic-hw-15-evidence \
            > /tmp/cosmic_hw_15_result.json
          python -m json.tool /tmp/cosmic_hw_15_result.json

      - name: Validate frozen HW-15 interpretation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/cosmic_hw_15_result.json').read_text())
          assert r['benchmark_id']=='COSMIC-HW-15-CANDIDATE'
          assert r['protocol']=='COSMIC-HW-15/v0.1'
          assert r['parent_hw14_source_head']=='292b94bd3e1c58355439c9212a7af5fa08c08a99'
          assert r['target']['density_flag']=='--85k'
          assert r['placement_seeds']==[1501,1502,1503,1504,1505]
          assert r['mapping_intervention']['candidate_flag']=='-nodsp'
          assert r['source_preservation']['passed'] is True
          assert r['synthetic_combined_score_used'] is False
          assert set(r['profiles'])=={
              'CORE_LITE_R40_NODSP',
              'PROOF_EDGE_SHA1_NODSP',
          }
          allowed={
              'NO_NODSP_PROFILE_ROUTE_DEPLOYABLE',
              'CORE_LITE_NODSP_BOARD_HANDOFF_SUPPORTED',
              'PROOF_EDGE_NODSP_BOARD_HANDOFF_SUPPORTED',
              'NODSP_ROUTABLE_BUT_HEADROOM_NOT_SUPPORTED',
          }
          assert r['decision'] in allowed
          for name,row in r['profiles'].items():
              assert row['smoke']['passed'] is True, name
              assert row['auto_dsp_control']['reproduction']['passed'] is True, name
              assert row['nodsp_candidate']['core_synthesis']['mult18x18d']==0, name
              assert row['nodsp_candidate']['harness_synthesis']['mult18x18d']==0, name
              assert row['anti_pruning']['passed'] is True, name
              assert len(row['seeds'])==5, name
          selected=r['selected_board_handoff_profile']
          if r['decision']=='PROOF_EDGE_NODSP_BOARD_HANDOFF_SUPPORTED':
              assert selected=='PROOF_EDGE_SHA1_NODSP'
          elif r['decision']=='CORE_LITE_NODSP_BOARD_HANDOFF_SUPPORTED':
              assert selected=='CORE_LITE_R40_NODSP'
          else:
              assert selected is None
          print('COSMIC-HW-15 frozen gates PASS')
          print('decision=',r['decision'])
          print('selected=',selected)
          PY

      - name: Build concise evidence summary
        if: success()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          r=json.loads(Path('/tmp/cosmic_hw_15_result.json').read_text())
          lines=[
              '## COSMIC-HW-15 hosted evidence',
              '',
              f"Exact candidate checkout: `{os.environ['GITHUB_SHA']}`",
              '',
              f"decision=`{r['decision']}`",
              f"selected_board_handoff_profile=`{r['selected_board_handoff_profile']}`",
              '',
              '| Profile | AUTO DSP | NODSP COMB | NODSP FF | NODSP DSP | Routes | Packs | 10 MHz | Headroom | Board handoff |',
              '|---|---:|---:|---:|---:|---:|---:|---:|---|---|',
          ]
          fmax_lines=[]
          for name in ('CORE_LITE_R40_NODSP','PROOF_EDGE_SHA1_NODSP'):
              row=r['profiles'][name]
              auto=row['auto_dsp_control']['harness_synthesis']
              cand=row['nodsp_candidate']['harness_synthesis']
              physical=row['physical']
              fractions=physical['maximum_resource_fractions']
              lines.append(
                  f"| {name} | {auto['mult18x18d']} | "
                  f"{cand['trellis_comb']} ({fractions['comb']*100:.1f}%) | "
                  f"{cand['trellis_ff']} ({fractions['ff']*100:.1f}%) | "
                  f"{cand['mult18x18d']} | "
                  f"{physical['successful_routes']}/5 | "
                  f"{physical['packed_bitstreams']}/5 | "
                  f"{physical['timing_10mhz_passes']}/5 | "
                  f"{'PASS' if physical['headroom_pass'] else 'NO'} | "
                  f"{'YES' if physical['board_handoff_eligible'] else 'NO'} |"
              )
              fm=physical['fmax_mhz']
              fmax_lines.append(
                  f"{name} routed Fmax min/median/max: "
                  f"{fm['minimum']} / {fm['median']} / {fm['maximum']} MHz"
              )
          lines.append('')
          lines.extend(fmax_lines)
          lines.extend([
              '',
              'Boundary: exact inherited RTL under standard Yosys `synth_ecp5 -nodsp`; identifies only a later board-experiment handoff profile.',
          ])
          Path('/tmp/cosmic_hw_15_evidence.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Upload complete HW-15 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-hw-15-result
          path: |
            /tmp/cosmic_hw_15_result.json
            /tmp/cosmic_hw_15_evidence.md
            /tmp/cosmic_hw_07_result.json
            /tmp/cosmic_hw_08_result.json
            /tmp/cosmic-hw-15-evidence
          if-no-files-found: ignore

      - name: Publish hosted evidence to issue 105
        if: success() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const body=fs.readFileSync('/tmp/cosmic_hw_15_evidence.md','utf8');
            await github.rest.issues.createComment({
              owner:context.repo.owner,
              repo:context.repo.repo,
              issue_number:105,
              body
            });

      - name: Publish hosted RED to issue 105
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner:context.repo.owner,
              repo:context.repo.repo,
              issue_number:105,
              body:`## COSMIC-HW-15 hosted RED\n\nExact checkout: \`${context.sha}\`\n\nThe frozen DSP-free experiment failed before an interpretable decision. Do not alter RTL arithmetic, target, seeds, 10 MHz gate, headroom limits, or profile order to force a pass.`
            });
