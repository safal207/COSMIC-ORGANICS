name: COSMIC-HW-17 Prereg

on:
  push:
    branches:
      - research/cosmic-hw-17-prereg
    paths:
      - benchmarks/cosmic_hw_17_manifest.json
      - tests/test_cosmic_hw_17_prereg.py
      - .github/workflows/cosmic_hw_17_prereg.yml
  pull_request:
    paths:
      - benchmarks/cosmic_hw_17_manifest.json
      - tests/test_cosmic_hw_17_prereg.py
      - .github/workflows/cosmic_hw_17_prereg.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cosmic-hw-17-prereg-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  prereg:
    name: prereg-python-${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install frozen open ECP5 toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            yosys=0.33-5build2 \
            iverilog=12.0-2build2 \
            nextpnr-ecp5=0.6-3build5 \
            fpga-trellis=1.4-2build4
          python -m pip install --quiet pytest
          yosys -V
          iverilog -V | head -n 2
          nextpnr-ecp5 --version
          command -v ecppack
          test -x "$(command -v ecppack)"
          yosys -p 'help synth_ecp5' | grep -q -- '-nodsp'

      - name: Validate frozen HW-17 manifest and candidate absence
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_cosmic_hw_17_prereg.py

      - name: Revalidate exact parent UART and synthesis boundary
        run: |
          PYTHONPATH=. python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path
          import tempfile

          from benchmarks.cosmic_hw_16_candidate import (
              anti_pruning,
              load_manifest,
              preservation_gate,
              simulate_uart,
              synthesize,
          )

          hw16 = load_manifest()
          preservation = preservation_gate(hw16)
          with tempfile.TemporaryDirectory(prefix="cosmic-hw17-prereg-") as temporary:
              tmp = Path(temporary)
              simulation = simulate_uart(tmp)
              core, _ = synthesize(tmp, board=False)
              board, netlist = synthesize(tmp, board=True)
              pruning = anti_pruning(core, board)
              netlist_sha256 = hashlib.sha256(netlist.read_bytes()).hexdigest()

          assert preservation["passed"] is True
          assert simulation["passed"] is True
          assert simulation["frame_sha256"] == (
              "16d448b3c5af0a09edc1817c6cf980f12d4806f0b6cfe969b2b524538e7e799b"
          )
          assert board["trellis_comb"] == 56262
          assert board["trellis_ff"] == 9286
          assert board["mult18x18d"] == 0
          assert board["cell_types"].get("EHXPLLL", 0) == 1
          assert pruning["passed"] is True

          summary = {
              "source_head": "${{ github.event.pull_request.head.sha || github.sha }}",
              "python": "${{ matrix.python-version }}",
              "frame_sha256": simulation["frame_sha256"],
              "board_synthesis": board,
              "core_synthesis": core,
              "anti_pruning": pruning,
              "netlist_sha256": netlist_sha256,
              "candidate_timeout_seconds": 2400,
              "seeds": [1601, 1602, 1603, 1604, 1605],
              "candidate_files_absent": True,
          }
          Path("/tmp/cosmic_hw_17_prereg_summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Record manifest fingerprint
        run: |
          sha256sum benchmarks/cosmic_hw_17_manifest.json \
            | tee /tmp/cosmic_hw_17_manifest.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: cosmic-hw-17-prereg-${{ matrix.python-version }}
          path: |
            benchmarks/cosmic_hw_17_manifest.json
            /tmp/cosmic_hw_17_manifest.sha256
            /tmp/cosmic_hw_17_prereg_summary.json
          if-no-files-found: error

      - name: Publish canonical prereg evidence
        if: github.event_name == 'push' && matrix.python-version == '3.12'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(
              fs.readFileSync('/tmp/cosmic_hw_17_prereg_summary.json', 'utf8')
            );
            const fingerprint = fs
              .readFileSync('/tmp/cosmic_hw_17_manifest.sha256', 'utf8')
              .trim()
              .split(/\s+/)[0];
            const body = [
              '## COSMIC-HW-17 prereg — hosted GREEN',
              '',
              `Exact prereg checkout: \`${context.sha}\``,
              '',
              '- parent HW-16 head: `1bb067bb7b325405eca703a16536eea79495410e`;',
              '- only admitted intervention: per-seed nextpnr timeout `1200 → 2400 s`;',
              '- exact seeds: `1601..1605`;',
              `- UART frame SHA-256: \`${summary.frame_sha256}\`;`,
              `- board synthesis: COMB \`${summary.board_synthesis.trellis_comb}\`, FF \`${summary.board_synthesis.trellis_ff}\`, DSP \`${summary.board_synthesis.mult18x18d}\`, PLL \`${summary.board_synthesis.cell_types.EHXPLLL || 0}\`;`,
              `- board netlist SHA-256: \`${summary.netlist_sha256}\`;`,
              `- manifest SHA-256: \`${fingerprint}\`;`,
              '- candidate runner/workflow absent on prereg head.',
              '',
              'Candidate implementation is authorized only after both Python lanes pass on this exact head. No RTL, board, seed, tool option, frequency or 3/5 threshold may change.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 118,
              body,
            });
