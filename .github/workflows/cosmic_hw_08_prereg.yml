name: COSMIC-HW-08 Prereg Gate

on:
  push:
    branches:
      - "research/cosmic-hw-08-prereg"
  pull_request:
    paths:
      - "benchmarks/cosmic_hw_08_manifest.json"
      - "benchmarks/cosmic_hw_08_kat.py"
      - "tests/test_cosmic_hw_08_prereg.py"
      - ".github/workflows/cosmic_hw_08_prereg.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  prereg:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install --quiet pytest
      - name: Run frozen HW-08 prereg gate
        run: python -m pytest tests/test_cosmic_hw_08_prereg.py -q
      - name: Print frozen SHA-256 KAT boundary
        run: |
          PYTHONPATH=. python - <<'PY'
          from benchmarks.cosmic_hw_08_kat import prereg_summary
          import json
          s = prereg_summary()
          print(json.dumps(s, indent=2, sort_keys=True))
          assert s["kat_count"] == 128
          assert s["kat_fingerprint"] == "3919530f4fb110bb453429fb50d8f6c6f664cf9506f5391a4b3a1e9fac5d5bbd"
          assert s["standard_kats"]["empty"] == "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
          assert s["standard_kats"]["abc"] == "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"
          PY
      - name: Publish prereg PASS to issue 79
        if: success() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 79,
              body: `## COSMIC-HW-08 prereg PASS — Python ${{ matrix.python-version }}\n\nExact prereg head: \`${context.sha}\`\n\n- candidate SHA RTL absent\n- 128 canonical full-batch KATs frozen\n- KAT fingerprint: \`3919530f4fb110bb453429fb50d8f6c6f664cf9506f5391a4b3a1e9fac5d5bbd\`\n- empty/abc SHA-256 reference vectors PASS\n- full 54-byte message -> one 512-bit padded block PASS\n- partial 1..9 receipt domain/count binding PASS\n- selected receipt baseline remains \`CONTROL_F4_FLAT\`\n- one iterative SHA-256 engine only; Merkle remains deferred\n\nNo candidate RTL result existed when this gate ran.`
            });
      - name: Publish prereg RED to issue 79
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 79,
              body: `## COSMIC-HW-08 prereg RED — Python ${{ matrix.python-version }}\n\nExact head: \`${context.sha}\`\n\nThe frozen SHA-256 preregistration failed before any candidate RTL is allowed. Do not change the KAT seed, canonical packing, batch size, partial-domain rule, selected receipt baseline, engine count, workload, or correctness gates to force a PASS.`
            });
