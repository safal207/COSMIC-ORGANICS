name: W6 Erasure Development

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run W6 erasure-aware unit tests
        run: python -m unittest tests.test_witness_erasure -v
      - name: Run frozen W6 erasure-aware development probe
        run: python -m benchmarks.probe_witness_erasure
