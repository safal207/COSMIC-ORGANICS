name: W8.1 Path Completion Development

on:
  pull_request:

permissions:
  contents: read

jobs:
  develop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run W8.1 unit contract
        run: python -m unittest tests.test_witness_path_completion -v
      - name: Run frozen W8.1 development gate
        run: python -m benchmarks.probe_witness_path_completion
