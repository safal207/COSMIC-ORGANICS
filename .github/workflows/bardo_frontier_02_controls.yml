name: BARDO-FRONTIER-02 Controls

on:
  push:
    branches:
      - "research/bardo-frontier-02-prereg"
    paths:
      - "benchmarks/bardo_frontier_02_manifest.json"
      - "docs/BARDO_FRONTIER_02_PREREG.md"
      - "morphos/sparse_scheduler.py"
      - "tests/test_sparse_scheduler.py"
      - ".github/workflows/bardo_frontier_02_controls.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  controls:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout exact control head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install repository
        run: python -m pip install -e .

      - name: Assert candidate is absent
        run: test ! -e morphos/bardo_frontier.py

      - name: Compile controls
        run: python -m compileall -q morphos/sparse_scheduler.py tests/test_sparse_scheduler.py

      - name: Run control tests
        run: python -m unittest -v tests.test_sparse_scheduler

      - name: Validate frozen preregistration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          m = json.loads(Path("benchmarks/bardo_frontier_02_manifest.json").read_text())
          assert m["experiment_id"] == "BARDO-FRONTIER-02/v0.1"
          assert m["status"] == "preregistered_before_candidate_implementation"
          assert m["parent_head"] == "565570e2c6c1942ad1f5c755fca654421f61b609"
          assert m["candidate_absent_at_freeze"] is True
          assert m["primary_decision_rule"] == "architecture_specific_operation_counts_only"
          assert m["timing_can_support_bardo_specific_claim"] is False
          assert m["workload"]["total_trials"] == 192
          assert m["workload"]["activity_densities"] == [0.01, 0.05, 0.20, 1.00]
          assert m["acceptance"]["timing_only_win_allowed"] is False
          assert m["acceptance"]["bardo_specific_node_evaluation_reduction_min_fraction_vs_dirty"] == 0.10
          print("BARDO-FRONTIER-02 preregistration PASS")
          PY

      - name: Publish control PASS evidence
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          body = f"""## BARDO-FRONTIER-02 controls PASS — Python {os.environ['PYTHON_VERSION']}

          Exact control head: `{os.environ['GITHUB_SHA']}`
          Frozen parent: `565570e2c6c1942ad1f5c755fca654421f61b609`

          - candidate absent: PASS
          - dense/dirty exactness tests: PASS
          - preregistration validation: PASS
          - timing-only Bardo claim: forbidden

          This head may be used as the frozen control base for a separate BARDO_FRONTIER candidate branch.
          """
          Path("comment.json").write_text(json.dumps({"body": body}), encoding="utf-8")
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/59/comments" --method POST --input comment.json

      - name: Publish control RED evidence
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          body = f"""## BARDO-FRONTIER-02 controls RED — Python {os.environ['PYTHON_VERSION']}

          Exact control head: `{os.environ['GITHUB_SHA']}`
          Frozen parent: `565570e2c6c1942ad1f5c755fca654421f61b609`

          The controls/preregistration lane failed. No BARDO_FRONTIER candidate should be interpreted until the control failure is diagnosed without changing frozen workload seeds or acceptance thresholds.
          """
          Path("comment.json").write_text(json.dumps({"body": body}), encoding="utf-8")
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/59/comments" --method POST --input comment.json
