name: W8.5 Multi-Erasure Development

on:
  pull_request:
    branches:
      - agent/morphos-w84-confirmation
  workflow_dispatch:

jobs:
  develop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run W8.5 unit contract
        run: python -m unittest tests.test_witness_multierasure -v
      - name: Run frozen W8.5 development gate
        run: python -m benchmarks.probe_witness_multierasure
