name: W8.4 Fresh Miss Diagnostic

on:
  pull_request:
    branches:
      - agent/morphos-w84-confirmation
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Classify W8.4 fresh confirmation misses
        run: python -m benchmarks.diagnose_w84_fresh_misses
