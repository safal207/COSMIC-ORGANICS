name: W5 Observability Compact

on:
  pull_request:

permissions:
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Summarize W5 no-handoff observability
        run: python -m benchmarks.summarize_w5_no_handoff_observability
