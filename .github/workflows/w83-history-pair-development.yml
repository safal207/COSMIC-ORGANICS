name: W8.3 History Pair Development

on:
  pull_request:
    branches:
      - agent/morphos-w82-confirmation
  workflow_dispatch:

jobs:
  develop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run W8.3 unit contract
        run: python -m unittest tests.test_witness_history_pair -v
      - name: Run frozen W8.3 development gate
        run: python -m benchmarks.probe_witness_history_pair
