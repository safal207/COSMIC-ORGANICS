name: COSMIC-HW-09 Prereg Gate

on:
  push:
    branches:
      - "research/cosmic-hw-09-prereg"
  pull_request:
    paths:
      - "benchmarks/cosmic_hw_09_manifest.json"
      - "tests/test_cosmic_hw_09_prereg.py"
      - ".github/workflows/cosmic_hw_09_prereg.yml"
  workflow_dispatch:

jobs:
  prereg:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run frozen HW-09 prereg gate
        run: PYTHONPATH=. python -m pytest -q tests/test_cosmic_hw_09_prereg.py
      - name: Print frozen throughput boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('benchmarks/cosmic_hw_09_manifest.json').read_text())
          print('COSMIC-HW-09 prereg PASS')
          print('parent', m['parent_hw08_head'])
          print('systems', m['systems'])
          print('x1 stalls', m['frozen_x1_control']['backpressure_stalls'])
          print('minimum per-group reduction', m['throughput_gates']['minimum_reduction_fraction_each_group'])
          print('candidate RTL absent by test contract')
          PY
