name: W8.2 Fresh Residual Diagnostic

on:
  pull_request:
    branches:
      - agent/morphos-w82-confirmation
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Trace W8.2 fresh residuals
        run: python -m benchmarks.diagnose_w82_fresh_residuals
