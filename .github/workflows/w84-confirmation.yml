name: W8.4 Confirmation

on:
  pull_request:
    branches:
      - agent/morphos-w84-causal-locality
  workflow_dispatch:

jobs:
  confirm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run W8.4 unit contract
        run: python -m unittest tests.test_witness_causal_locality -v
      - name: Run frozen W8.4 fresh confirmation
        run: python -m benchmarks.run_w84_confirmation
