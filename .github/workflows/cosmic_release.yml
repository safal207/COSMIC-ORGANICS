name: COSMIC Release

on:
  pull_request:
    paths:
      - 'morphos/**'
      - 'demos/**'
      - 'rtl/**'
      - 'benchmarks/**'
      - 'tests/**'
      - 'scripts/verify_release.py'
      - 'docs/**'
      - 'README.md'
      - 'pyproject.toml'
      - '.github/workflows/cosmic_release.yml'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_fpga:
        description: 'Reproduce the frozen ECP5-85F capacity result'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  focused-release:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip pytest
          sudo apt-get update -qq
          sudo apt-get install -y iverilog

      - name: Verify software kernel, demo, and RTL smoke
        run: python scripts/verify_release.py --rtl-smoke --output /tmp/verified-incident-map.json

      - name: Upload canonical demo artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-release-verified-incident-map
          path: /tmp/verified-incident-map.json
          if-no-files-found: error

  optional-fpga:
    if: github.event_name == 'workflow_dispatch' && inputs.run_fpga
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen open FPGA toolchain
        run: |
          python -m pip install --upgrade pip pytest
          sudo apt-get update -qq
          sudo apt-get install -y \
            yosys=0.33-5build2 \
            iverilog=12.0-2build2 \
            nextpnr-ecp5=0.6-3build5 \
            fpga-trellis=1.4-2build4

      - name: Reproduce frozen HW-13 capacity boundary
        run: |
          python scripts/verify_release.py \
            --fpga \
            --output /tmp/verified-incident-map.json \
            --fpga-output /tmp/hw13-ecp5.json

      - uses: actions/upload-artifact@v4
        with:
          name: cosmic-release-hw13-ecp5
          path: |
            /tmp/verified-incident-map.json
            /tmp/hw13-ecp5.json
          if-no-files-found: error
