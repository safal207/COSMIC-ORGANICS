name: W8 Path Continuity Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trace frozen W8-v0 failures
        run: python -m benchmarks.diagnose_w8_path_continuity
