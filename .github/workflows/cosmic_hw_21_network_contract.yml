name: COSMIC-HW-21 Network Pyramid Contract

on:
  push:
    branches:
      - feat/cosmic-hw-21-network-pyramid
  pull_request:
    paths:
      - ".github/workflows/cosmic_hw_21_network_contract.yml"
      - "benchmarks/cosmic_hw_21_network_manifest.json"
      - "docs/cosmic-hw-21-network-pyramid.md"
      - "rtl/cosmic_hw_06.v"
      - "rtl/cosmic_hw_07_receipt.v"
      - "rtl/cosmic_hw_08_sha256.v"
      - "rtl/cosmic_hw_21_network_pyramid.v"
      - "tools/cosmic_hw_21_network.py"
      - "tests/test_cosmic_hw_21_network.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cosmic-hw-21-network-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      COSMIC_HW21_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.COSMIC_HW21_EXPECTED_HEAD }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen simulator and synthesis toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            yosys=0.33-5build2 \
            iverilog=12.0-2build2
          python -m pip install --quiet pytest
          yosys -V
          iverilog -V | head -n 2

      - name: Run bounded HW-21 contracts
        run: python -m pytest -q tests/test_cosmic_hw_21_network.py

      - name: Simulate pyramid and synthesize x2/x4 frontier
        run: |
          python tools/cosmic_hw_21_network.py \
            --output-dir build/cosmic-hw-21-network

      - name: Enforce exact-head scaling and claim boundary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              Path("build/cosmic-hw-21-network/cosmic_hw_21_network_result.json").read_text()
          )
          expected = os.environ["COSMIC_HW21_EXPECTED_HEAD"]
          assert result["passed"] is True
          assert result["source_identity"]["initial"]["head"] == expected
          assert result["source_identity"]["final"]["head"] == expected
          assert [row["engines"] for row in result["layers"]] == [2, 4, 8, 16]
          assert result["layers"][0]["compute_cycles"] == 482
          assert all(row["oracle_match"] is True for row in result["layers"])
          assert all(row["aggregate_sha_busy_cycles"] == 832 for row in result["layers"])
          cycles = [row["compute_cycles"] for row in result["layers"]]
          assert cycles == sorted(cycles, reverse=True)
          assert all(row["speedup_vs_x1"] <= row["engines"] for row in result["layers"])
          assert result["superlinear_speedup_claim_allowed"] is False
          assert result["physical_board_executed"] is False
          assert result["physical_execution_state"] == "NOT_RUN"
          assert result["competitive_claim_allowed"] is False
          assert result["decision"] in {
              "NETWORK_PYRAMID_SPEEDUP_SUPPORTED_SINGLE_BOARD_CAPACITY_LIMIT",
              "NETWORK_PYRAMID_CPU_PARITY_MODELED_PHYSICAL_NOT_RUN",
          }
          PY

      - name: Upload exact-head HW-21 evidence
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-hw-21-network-${{ env.COSMIC_HW21_EXPECTED_HEAD }}
          path: build/cosmic-hw-21-network/
          if-no-files-found: error
          retention-days: 30
