name: W8.4 Transition Observability Diagnostic

on:
  pull_request:
    branches:
      - agent/morphos-w84-fresh-miss-diagnostic
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Trace A/M/C observability for frozen W8.4 misses
        run: python -m benchmarks.diagnose_w84_transition_observability
