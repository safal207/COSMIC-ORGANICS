name: PB-TRANSITION-03 MORPHOS adapter

on:
  pull_request:
    paths:
      - "benchmarks/pb_transition_03.py"
      - "morphos/simulator.py"
      - ".github/workflows/pb_transition_03.yml"
  workflow_dispatch:

jobs:
  pb-transition-03:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute MORPHOS PB-TRANSITION-03 adapter
        run: |
          python -m benchmarks.pb_transition_03 --trials 10000 --contamination 0.10 \
            > /tmp/pb_transition_03.json
          python -m json.tool /tmp/pb_transition_03.json
      - name: Validate partial semantic coverage contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/pb_transition_03.json').read_text())
          assert report['benchmark_id'] == 'PB-TRANSITION-03'
          assert report['version'] == '0.1'
          assert report['status'] == 'executed_partial'
          assert report['trials'] == 10000
          assert report['valid_trials'] == 9000
          assert report['adversarial_trials'] == 1000
          assert report['supported_fault_kinds'] == ['UNKNOWN']
          assert report['failure_kind_coverage'] == 0.2
          assert report['assessed_trials'] == 9200
          assert report['unassessed_trials'] == 800
          assert report['oracle_correct_assessed_trials'] == 9200
          assert report['oracle_accuracy_on_assessed'] == 1.0
          assert report['unsafe_authorization_dispatches_on_assessed'] == 0
          assert report['missed_valid_dispatches_on_assessed'] == 0
          assert report['native_steps_total'] == 18400
          assert report['per_kind']['FALSE_SUCCESS']['status'] == 'unsupported'
          PY
