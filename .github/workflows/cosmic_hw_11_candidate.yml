name: COSMIC-HW-11 Candidate Frontier

on:
  push:
    branches:
      - "research/cosmic-hw-11-candidate"
  pull_request:
    paths:
      - "rtl/cosmic_hw_11_merkle_frontier.v"
      - "benchmarks/cosmic_hw_11_candidate.py"
      - ".github/workflows/cosmic_hw_11_candidate.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install open-source RTL tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog yosys
          iverilog -V | head -n 2
          yosys -V
      - name: Revalidate frozen HW-11 prereg
        run: |
          python -m pip install --quiet pytest
          PYTHONPATH=. python -m pytest -q tests/test_cosmic_hw_11_prereg.py
      - name: Re-run inherited leaf SHA KAT
        run: PYTHONPATH=. python benchmarks/run_cosmic_hw_08_sha_kat.py
      - name: Re-run inherited two-block parent SHA KAT
        run: PYTHONPATH=. python benchmarks/run_cosmic_hw_10_parent_kat.py
      - name: Execute frozen HW-11 factorial frontier
        run: |
          PYTHONPATH=. python benchmarks/cosmic_hw_11_candidate.py --json > /tmp/cosmic_hw_11_result.json
          python -m json.tool /tmp/cosmic_hw_11_result.json
      - name: Validate frozen HW-11 gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/cosmic_hw_11_result.json').read_text())
          assert r['benchmark_id']=='COSMIC-HW-11-CANDIDATE'
          assert r['protocol']=='COSMIC-HW-11/v0.1'
          assert r['decision'] in {'MERKLE_THROUGHPUT_VALUE_SUPPORTED','NO_ELIGIBLE_MERKLE_THROUGHPUT_IMPROVEMENT'}
          assert r['control']['simulation']['physical_cycles']==1027209
          assert r['control']['simulation']['backpressure_stalls']=={'0.01':0,'0.05':542,'0.20':11184,'1.00':13456,'stress':80560}
          assert r['control']['synthesis']['lut']==36907
          assert r['control']['synthesis']['ff']==21380
          assert r['control']['synthesis']['core_cells_excluding_io']==62125
          assert set(r['systems'])=={'B2_M1','B1_M2','B2_M2'}
          for name,row in r['systems'].items():
              s=row['simulation']
              assert s['sequences']==320
              assert s['accepted_ticks']==3840
              assert s['receipts_emitted']==41144
              assert s['leaf_digests_emitted']==4240
              assert s['roots_emitted']==444
              assert s['proof_fragments_emitted']==16960
              assert s['parent_hashes']==6660
              assert s['merkle_sha_busy_cycles_aggregate']==852480
              assert row['root_match_fraction']==1.0
              assert row['proof_fragment_match_fraction']==1.0
              assert row['independently_verified_proof_fraction']==1.0
              assert row['synthesis']['lut']>0 and row['synthesis']['ff']>0
          if r['decision']=='MERKLE_THROUGHPUT_VALUE_SUPPORTED':
              assert r['selected_handoff'] in r['systems']
              assert r['systems'][r['selected_handoff']]['eligible'] is True
          else:
              assert r['selected_handoff'] is None
              assert not any(row['eligible'] for row in r['systems'].values())
          assert r['synthetic_combined_score_used'] is False
          print('COSMIC-HW-11 frozen gates PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cosmic-hw-11-result
          path: /tmp/cosmic_hw_11_result.json
