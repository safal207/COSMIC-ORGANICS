name: W5 Confirmation

on:
  pull_request:

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run frozen W5 confirmation
        run: python -m benchmarks.run_w5_confirmation --output /tmp/w5-full.json
      - name: Render portable W5 confirmation summary
        run: python -m benchmarks.render_w5_confirmation_summary --report /tmp/w5-full.json --output /tmp/w5-summary.json
      - name: Verify committed W5 confirmation summary
        run: cmp /tmp/w5-summary.json results/p1-w5-confirmation-v0.1-summary.json
      - name: Print W5 confirmation summary
        run: cat /tmp/w5-summary.json
