name: COSMIC-HW-13 Candidate P&R

on:
  pull_request:
    paths:
      - 'rtl/cosmic_hw_13_ecp5_harness.v'
      - 'benchmarks/cosmic_hw_13_candidate.py'
      - 'tests/test_cosmic_hw_13_cell_counts.py'
      - '.github/workflows/cosmic_hw_13_candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen open FPGA toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            yosys=0.33-5build2 \
            iverilog=12.0-2build2 \
            nextpnr-ecp5=0.6-3build5 \
            fpga-trellis=1.4-2build4
          python -m pip install --quiet pytest
          yosys -V
          iverilog -V | head -n 2
          nextpnr-ecp5 --version
          dpkg-query -W -f='${Version}\n' fpga-trellis

      - name: Revalidate frozen HW-13 prereg and ECP5 metric parser
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_cosmic_hw_13_prereg.py \
            tests/test_cosmic_hw_13_cell_counts.py \
            -k 'not candidate_files_absent_on_prereg_head'

      - name: Re-run inherited 446-vector HMAC RTL gate
        run: PYTHONPATH=. python benchmarks/run_cosmic_hw_12_hmac_kat.py

      - name: Execute frozen HW-13 ECP5 physical experiment
        run: |
          PYTHONPATH=. python benchmarks/cosmic_hw_13_candidate.py --json > /tmp/cosmic_hw_13_result.json
          python -m json.tool /tmp/cosmic_hw_13_result.json

      - name: Validate frozen HW-13 interpretation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/cosmic_hw_13_result.json').read_text())
          assert r['benchmark_id']=='COSMIC-HW-13-CANDIDATE'
          assert r['protocol']=='COSMIC-HW-13/v0.1'
          assert r['parent_hw12_source_head']=='7bad7ba095c65221e057696df40fcd6c53dee2b8'
          assert r['target']['part']=='LFE5U-85F-8BG381C'
          assert r['target']['package']=='CABGA381'
          assert r['target']['speed_grade']=='8'
          assert r['target']['requested_clock_mhz']==10.0
          assert r['preservation']['exact_core_instance'] is True
          assert r['harness_smoke']['accepted_ticks'] > 0
          assert r['anti_pruning']['passed'] is True
          assert len(r['seeds'])==5
          assert [x['seed'] for x in r['seeds']]==[1301,1302,1303,1304,1305]
          assert r['synthetic_combined_score_used'] is False
          allowed={
            'DEVICE_CAPACITY_NOT_SUPPORTED',
            'PLACE_ROUTE_FAILED',
            'ECP5_10MHZ_TIMING_NOT_SUPPORTED',
            'ECP5_POST_ROUTE_FEASIBILITY_SUPPORTED',
          }
          assert r['decision'] in allowed, r['decision']
          print('COSMIC-HW-13 frozen candidate interpretation PASS decision='+r['decision'])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cosmic-hw-13-result
          path: /tmp/cosmic_hw_13_result.json
          if-no-files-found: warn
