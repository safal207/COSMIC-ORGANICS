name: COSMIC-HW-07 Prereg Gate

on:
  push:
    branches:
      - "research/cosmic-hw-07-prereg"
  pull_request:
    paths:
      - "benchmarks/cosmic_hw_07_manifest.json"
      - "benchmarks/cosmic_hw_07_stress.py"
      - "docs/cosmic-hw-07-methodology.md"
      - "tests/test_cosmic_hw_07_prereg.py"
      - ".github/workflows/cosmic_hw_07_prereg.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  prereg:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install --quiet pytest
      - name: Run HW-07 prereg and stress-corpus gates
        run: python -m pytest tests/test_cosmic_hw_07_prereg.py -q
      - name: Print frozen stress summary
        run: PYTHONPATH=. python benchmarks/cosmic_hw_07_stress.py
      - name: Publish prereg PASS
        if: success() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('child_process');
            const summary = execFileSync('python', ['benchmarks/cosmic_hw_07_stress.py'], {
              env: {...process.env, PYTHONPATH: '.'}, encoding: 'utf8'
            }).trim();
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 73,
              body: `## COSMIC-HW-07 prereg PASS — Python ${{ matrix.python-version }}\n\nExact prereg head: \`${context.sha}\`\n\n- 40-bit receipt contract: PASS\n- 1-lane valid/ready serializer: PASS\n- 4-batch finite queue: PASS\n- pre-commit reservation/backpressure semantics: PASS\n- 64-sequence receipt stress corpus: PASS\n- receipt candidate RTL absent: PASS\n- physical SHA/Merkle deferred: PASS\n- synthetic combined score forbidden: PASS\n\nStress summary: \`${summary}\``
            });
      - name: Publish prereg RED
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 73,
              body: `## COSMIC-HW-07 prereg RED — Python ${{ matrix.python-version }}\n\nExact prereg head: \`${context.sha}\`\n\nThe receipt prereg/stress gate failed. Do not implement or credit receipt RTL until this boundary is green.`
            });
