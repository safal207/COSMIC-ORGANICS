name: W8.5 Confirmation

on:
  pull_request:
    branches:
      - agent/morphos-w85-multierasure-handoff
  workflow_dispatch:

jobs:
  confirm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run W8.5 unit contract
        run: python -m unittest tests.test_witness_multierasure -v
      - name: Run frozen W8.5 fresh confirmation
        run: python -m benchmarks.run_w85_confirmation
