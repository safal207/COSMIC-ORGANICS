name: W6 Actuation Compact

on:
  pull_request:

permissions:
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Summarize frozen W6 post-handoff actuation
        run: python -m benchmarks.summarize_w6_actuation_boundary
