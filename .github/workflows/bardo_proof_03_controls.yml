name: BARDO-PROOF-03 Controls

on:
  push:
    branches:
      - "research/bardo-proof-03-prereg"
    paths:
      - "benchmarks/bardo_proof_03_manifest.json"
      - "docs/BARDO_PROOF_03_PREREG.md"
      - "morphos/proof_controls.py"
      - "tests/test_proof_controls.py"
      - ".github/workflows/bardo_proof_03_controls.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  controls:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout exact control head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install repository
        run: python -m pip install -e .

      - name: Assert Bardo proof candidate is absent
        run: test ! -e morphos/bardo_proof_edges.py

      - name: Compile controls
        run: python -m compileall -q morphos/proof_controls.py tests/test_proof_controls.py

      - name: Run proof control tests
        run: python -m unittest -v tests.test_proof_controls

      - name: Validate frozen preregistration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          m = json.loads(Path("benchmarks/bardo_proof_03_manifest.json").read_text())
          assert m["experiment_id"] == "BARDO-PROOF-03/v0.1"
          assert m["status"] == "preregistered_before_bardo_candidate_implementation"
          assert m["parent_head"] == "2021c7ea03519f58c30e37c6e720b6a1db4e4d32"
          assert m["candidate_absent_at_freeze"] is True
          assert m["workload"]["total_queries"] == 192
          assert m["workload"]["chain_lengths"] == [1, 4, 16, 64]
          assert len(m["workload"]["mutation_types"]) == 6
          assert m["frozen_config"]["memory_decay"] == 0.0
          assert m["primary_decision_rule"] == "deterministic_proof_size_and_verification_work"
          assert m["timing_can_support_bardo_specific_claim"] is False
          assert m["acceptance"]["timing_only_win_allowed"] is False
          print("BARDO-PROOF-03 preregistration PASS")
          PY

      - name: Publish control PASS evidence
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          body = f"""## BARDO-PROOF-03 controls PASS — Python {os.environ['PYTHON_VERSION']}

          Exact control head: `{os.environ['GITHUB_SHA']}`
          Frozen parent: `2021c7ea03519f58c30e37c6e720b6a1db4e4d32`

          - Bardo proof candidate absent: PASS
          - snapshot/local/DAG verifier tests: PASS
          - mutation rejection controls: PASS
          - preregistration validation: PASS
          - timing-only claim: forbidden

          This head may be frozen as the base for a separate BARDO_PROOF_EDGE candidate.
          """
          Path("comment.json").write_text(json.dumps({"body": body}), encoding="utf-8")
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/62/comments" --method POST --input comment.json

      - name: Publish control RED evidence
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          body = f"""## BARDO-PROOF-03 controls RED — Python {os.environ['PYTHON_VERSION']}

          Exact control head: `{os.environ['GITHUB_SHA']}`
          Frozen parent: `2021c7ea03519f58c30e37c6e720b6a1db4e4d32`

          The proof-control lane failed before candidate implementation. Frozen seeds, proof schemas, mutation families, and acceptance thresholds must not be changed to force a later result.
          """
          Path("comment.json").write_text(json.dumps({"body": body}), encoding="utf-8")
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/62/comments" --method POST --input comment.json
