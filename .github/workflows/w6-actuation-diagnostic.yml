name: W6 Actuation Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trace W6 post-handoff actuation boundary
        run: python -m benchmarks.diagnose_w6_actuation_boundary
