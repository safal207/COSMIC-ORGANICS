name: W8.4 Multi-Erasure Solvability Diagnostic

on:
  pull_request:
    branches:
      - agent/morphos-w84-transition-observability-diagnostic
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Solve frozen multi-M parity systems
        run: python -m benchmarks.diagnose_w84_multierasure_solvability
