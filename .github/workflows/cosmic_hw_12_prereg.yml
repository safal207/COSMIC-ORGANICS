name: COSMIC-HW-12 Prereg

on:
  push:
    branches:
      - "research/cosmic-hw-12-prereg"
  pull_request:
    paths:
      - "benchmarks/cosmic_hw_12_manifest.json"
      - "benchmarks/cosmic_hw_12_oracle.py"
      - "tests/test_cosmic_hw_12_prereg.py"
      - ".github/workflows/cosmic_hw_12_prereg.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  prereg:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Run frozen HW-12 prereg gate
        run: PYTHONPATH=. python -m pytest -q tests/test_cosmic_hw_12_prereg.py
      - name: Print frozen HW-12 HMAC oracle
        run: PYTHONPATH=. python benchmarks/cosmic_hw_12_oracle.py
