name: COSMIC Release CI

on:
  push:
    branches:
      - release/cosmic-research-v0.1
  pull_request:
    paths:
      - 'morphos/**'
      - 'demos/**'
      - 'tests/**'
      - 'benchmarks/**'
      - 'rtl/**'
      - 'docs/**'
      - 'README.md'
      - 'Makefile'
      - 'pyproject.toml'
      - '.github/workflows/cosmic_release_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software-release:
    name: software-release (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install release package
        run: python -m pip install -e .
      - name: Execute release verification and demo
        run: make release-check PYTHON=python
      - name: Verify installed console entrypoint
        run: cosmic-incident-demo --compact

  rtl-hmac-smoke:
    name: RTL HMAC smoke (446 vectors)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and Icarus
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          python -m pip install -e .
          iverilog -V | head -n 2
      - name: Execute frozen HMAC RTL gate
        run: make rtl-smoke PYTHON=python
