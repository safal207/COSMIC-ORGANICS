name: BARDO-FRONTIER-02 Candidate

on:
  push:
    branches:
      - "research/bardo-frontier-02-candidate"
    paths:
      - "morphos/bardo_frontier.py"
      - "morphos/sparse_scheduler.py"
      - "tests/test_bardo_frontier.py"
      - "tests/test_sparse_scheduler.py"
      - "benchmarks/run_bardo_frontier_02.py"
      - "benchmarks/bardo_frontier_02_manifest.json"
      - ".github/workflows/bardo_frontier_02_candidate.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  candidate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install repository
        run: python -m pip install -e .

      - name: Compile candidate surface
        run: |
          python -m compileall -q \
            morphos/sparse_scheduler.py \
            morphos/bardo_frontier.py \
            tests/test_sparse_scheduler.py \
            tests/test_bardo_frontier.py \
            benchmarks/run_bardo_frontier_02.py

      - name: Run control and candidate tests
        run: |
          python -m unittest -v \
            tests.test_sparse_scheduler \
            tests.test_bardo_frontier

      - name: Execute frozen 192-trial workload
        run: PYTHONPATH=. python benchmarks/run_bardo_frontier_02.py > bardo-frontier-02-result.json

      - name: Validate frozen result boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          r = json.loads(Path("bardo-frontier-02-result.json").read_text())
          assert r["experiment_id"] == "BARDO-FRONTIER-02/v0.1"
          assert r["frozen_control_head"] == "de23537427302cc24c25ad41eacb71496cb6c124"
          assert r["candidate_results_observed_after_preregistration"] is True
          assert r["total_trials"] == 192
          assert r["precondition_failures"] == 0
          assert r["state_mismatches"] == 0
          assert r["transition_count_mismatches"] == 0
          assert r["dense_negative_control_violations"] == 0
          assert r["primary_metrics_complete"] is True
          assert r["timing_decides_bardo_claim"] is False
          assert r["decision"] in {
              "NO_SPARSE_EXECUTION_VALUE",
              "SPARSE_EXECUTION_VALUE_ONLY",
              "BARDO_FRONTIER_VALUE_SUPPORTED",
          }
          print(json.dumps({
              "decision": r["decision"],
              "generic_sparse_supported": r["generic_sparse_supported"],
              "bardo_specific_supported": r["bardo_specific_supported"],
              "density_comparison": r["density_comparison"],
          }, indent=2, sort_keys=True))
          PY

      - name: Publish hosted evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          r = json.loads(Path("bardo-frontier-02-result.json").read_text())
          lines = []
          for density, row in sorted(r["density_comparison"].items()):
              lines.append(
                  f"density={density} dirty_reduction_vs_dense={row['dirty_node_evaluation_reduction_vs_dense']:.6f} "
                  f"bardo_reduction_vs_dirty={row['bardo_node_evaluation_reduction_vs_dirty']:.6f} "
                  f"bardo_runtime_fraction_vs_dirty={row['bardo_runtime_fraction_vs_dirty']:.6f}"
              )
          body = f"""## BARDO-FRONTIER-02 hosted evidence — Python {os.environ['PYTHON_VERSION']}

          Exact candidate head: `{os.environ['GITHUB_SHA']}`
          Frozen control head: `de23537427302cc24c25ad41eacb71496cb6c124`

          ```text
          decision={r['decision']}
          total_trials={r['total_trials']}
          state_mismatches={r['state_mismatches']}
          transition_count_mismatches={r['transition_count_mismatches']}
          dense_negative_control_violations={r['dense_negative_control_violations']}
          generic_sparse_supported={str(r['generic_sparse_supported']).lower()}
          bardo_specific_supported={str(r['bardo_specific_supported']).lower()}
          bardo_supported_sparse_bands={r['bardo_supported_sparse_bands']}
          bardo_sparse_regressions={r['bardo_sparse_regressions']}
          {chr(10).join(lines)}
          ```

          Primary Bardo decision route: node-evaluation counts only. Wall-clock timing is diagnostic and cannot support the Bardo-specific claim.

          Full machine-readable result is attached to the Actions run as `bardo-frontier-02-result.json`.
          """
          Path("comment.json").write_text(json.dumps({"body": body}), encoding="utf-8")
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/59/comments" --method POST --input comment.json

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: bardo-frontier-02-${{ matrix.python-version }}-${{ github.sha }}
          path: bardo-frontier-02-result.json
          if-no-files-found: error

      - name: Publish hosted RED evidence
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          body = f"""## BARDO-FRONTIER-02 candidate RED — Python {os.environ['PYTHON_VERSION']}

          Exact candidate head: `{os.environ['GITHUB_SHA']}`
          Frozen control head: `de23537427302cc24c25ad41eacb71496cb6c124`

          The hosted candidate lane failed before a valid frozen verdict was published. Frozen seeds, operation-count gates, and thresholds remain unchanged.
          """
          Path("failure.json").write_text(json.dumps({"body": body}), encoding="utf-8")
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/59/comments" --method POST --input failure.json
