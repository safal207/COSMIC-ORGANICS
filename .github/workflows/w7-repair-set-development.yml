name: W7 Repair Set Development

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run W7 repair-set unit tests
        run: python -m unittest tests.test_witness_repair_set -v
      - name: Run frozen W7 repair-set development probe
        run: python -m benchmarks.probe_witness_repair_set
