name: W8.1 Numeric Contract Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trace exact W8.1 transition arithmetic
        run: python -m benchmarks.diagnose_w81_numeric_contract
