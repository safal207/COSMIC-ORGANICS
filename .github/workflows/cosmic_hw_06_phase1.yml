name: COSMIC-HW-06 Phase 1 RTL

on:
  push:
    branches:
      - "research/cosmic-hw-06-candidate"
  pull_request:
    paths:
      - "rtl/cosmic_hw_06.v"
      - "benchmarks/cosmic_hw_06_*.py"
      - "tests/test_cosmic_hw_06_*.py"
      - ".github/workflows/cosmic_hw_06_phase1.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  dense-sparse-rtl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install open-source RTL tools and test dependency
        run: |
          python -m pip install --quiet pytest
          sudo apt-get update -qq
          sudo apt-get install -y iverilog yosys
          iverilog -V | head -n 2
          yosys -V
      - name: Run frozen vector and work-oracle tests
        run: |
          python -m pytest tests/test_cosmic_hw_06_vectors.py tests/test_cosmic_hw_06_phase1.py -q
      - name: Simulate and synthesize dense/sparse 64-PE RTL
        run: |
          python benchmarks/cosmic_hw_06_phase1.py --json > /tmp/cosmic_hw_06_phase1.json
          python -m json.tool /tmp/cosmic_hw_06_phase1.json
      - name: Validate frozen phase-1 gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('/tmp/cosmic_hw_06_phase1.json').read_text())
          assert r['benchmark_id'] == 'COSMIC-HW-06-PHASE1'
          assert r['protocol'] == 'COSMIC-HW-06/v0.1 dense-sparse-64pe'
          assert r['simulation']['vectors'] == 256
          assert r['simulation']['ticks'] == 3072
          assert r['decision'] == 'SPARSE_RTL_VALUE_SUPPORTED'
          assert r['execution_work']['0.01']['pe_evaluation_reduction'] >= 0.50
          assert r['execution_work']['0.05']['pe_evaluation_reduction'] >= 0.50
          assert r['proof_logic_present'] is False
          assert r['timing_decisive'] is False
          for system in ('dense', 'sparse'):
              row = r['synthesis'][system]
              assert row['core_cells_excluding_io'] > 0
              assert row['ff'] > 0
              assert row['logic_depth_proxy'] > 0
          lines = [
              '## COSMIC-HW-06 Phase 1 hosted evidence',
              '',
              f"Exact candidate head: `{__import__('os').environ['GITHUB_SHA']}`",
              '',
              f"decision=`{r['decision']}`",
              f"vectors={r['simulation']['vectors']}",
              f"ticks={r['simulation']['ticks']}",
              f"checks={r['simulation']['checks']}",
              '',
              'PE-evaluation reduction:',
          ]
          for density in ('0.01','0.05','0.20','1.00'):
              row = r['execution_work'][density]
              lines.append(
                  f"- activity {density}: {row['dense_pe_evaluations']} -> {row['sparse_pe_evaluations']} "
                  f"({row['pe_evaluation_reduction']*100:.2f}% reduction)"
              )
          lines += [
              '',
              'Structural mapping (Xilinx-7 proxy):',
              f"- dense: LUT={r['synthesis']['dense']['lut']} FF={r['synthesis']['dense']['ff']} "
              f"core_cells={r['synthesis']['dense']['core_cells_excluding_io']} depth={r['synthesis']['dense']['logic_depth_proxy']}",
              f"- sparse: LUT={r['synthesis']['sparse']['lut']} FF={r['synthesis']['sparse']['ff']} "
              f"core_cells={r['synthesis']['sparse']['core_cells_excluding_io']} depth={r['synthesis']['sparse']['logic_depth_proxy']}",
              '',
              'Boundary: functional Icarus + Yosys structural evidence only; no board power/Fmax/ASIC claim.'
          ]
          Path('/tmp/cosmic_hw_06_phase1_evidence.md').write_text('\n'.join(lines))
          PY
      - name: Publish hosted evidence to issue 70
        if: success() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/cosmic_hw_06_phase1_evidence.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 70,
              body
            });
      - name: Publish hosted RED to issue 70
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 70,
              body: `## COSMIC-HW-06 Phase 1 hosted RED\n\nExact candidate head: \`${context.sha}\`\n\nThe RTL/vector/synthesis lane failed before a valid phase-1 verdict. Frozen vectors and gates must not be changed to force a PASS.`
            });
