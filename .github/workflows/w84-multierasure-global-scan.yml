name: W8.4 Multi-Erasure Global Scan

on:
  pull_request:
    branches:
      - agent/morphos-w84-multierasure-solvability-diagnostic
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan 1728 observed trials for multi-M solver false positives
        run: python -m benchmarks.diagnose_w84_multierasure_global_scan
