name: W8.5 Confirmation Materialize

permissions:
  contents: write

on:
  pull_request:
    branches:
      - agent/morphos-w85-confirmation
  workflow_dispatch:

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/morphos-w85-confirmation-summary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize compact frozen confirmation result
        run: |
          mkdir -p results
          python - <<'PY'
          import json
          from benchmarks.run_w85_confirmation import run_confirmation
          r = run_confirmation()
          rows = r['rows']
          compact = {
              'schema': 'cosmic-organics/w85-confirmation-compact-0.1',
              'source_confirmation_head': '33f9c4d7d9971a169745d108319f1c15ef298204',
              'passes': r['passes'],
              'summary': r['summary'],
              'multi_erasure_rescues': r['multi_erasure_rescues'],
              'nonperfect_or_active_rows': [
                  row for row in rows
                  if row['w85_recovery_at_8'] < 1.0
                  or row['w85_recovery_at_12'] < 1.0
                  or row['fresh_w84_misses'] > 0
                  or row['multi_erasure_decode_events'] > 0
              ],
          }
          with open('results/w85-confirmation-compact.json','w') as f:
              json.dump(compact, f, indent=2, sort_keys=True)
              f.write('\n')
          PY
      - name: Commit diagnostic result if changed
        run: |
          if git diff --quiet -- results/w85-confirmation-compact.json && git ls-files --error-unmatch results/w85-confirmation-compact.json >/dev/null 2>&1; then
            echo 'compact result already materialized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/w85-confirmation-compact.json
          git commit -m 'evidence: materialize W8.5 compact confirmation result'
          git push origin HEAD:agent/morphos-w85-confirmation-summary
