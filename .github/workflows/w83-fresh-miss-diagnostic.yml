name: W8.3 Fresh Miss Diagnostic

on:
  pull_request:
    branches:
      - agent/morphos-w83-confirmation
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Trace sole W8.3 fresh-confirmation miss
        run: python -m benchmarks.diagnose_w83_fresh_miss
