name: COSMIC-HW-07 Receipt RTL

on:
  push:
    branches:
      - "research/cosmic-hw-07-candidate"
  pull_request:
    paths:
      - "rtl/cosmic_hw_07_receipt.v"
      - "benchmarks/cosmic_hw_07_*.py"
      - "benchmarks/cosmic_hw_07_manifest.json"
      - "tests/test_cosmic_hw_07_*.py"
      - ".github/workflows/cosmic_hw_07_candidate.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  receipt-rtl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install open-source RTL tools and test dependency
        run: |
          python -m pip install --quiet pytest
          sudo apt-get update -qq
          sudo apt-get install -y iverilog yosys
          iverilog -V | head -n 2
          yosys -V

      - name: Run frozen controls and candidate contract tests
        run: |
          python -m pytest \
            tests/test_cosmic_hw_06_vectors.py \
            tests/test_cosmic_hw_06_phase1.py \
            tests/test_cosmic_hw_07_candidate.py -q

      - name: Execute frozen phase-1 plus receipt-stress workload
        run: |
          PYTHONPATH=. python benchmarks/cosmic_hw_07_candidate.py --json > /tmp/cosmic_hw_07_result.json
          python -m json.tool /tmp/cosmic_hw_07_result.json

      - name: Validate frozen HW-07 gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          r = json.loads(Path('/tmp/cosmic_hw_07_result.json').read_text())
          assert r['benchmark_id'] == 'COSMIC-HW-07-CANDIDATE'
          assert r['protocol'] == 'COSMIC-HW-07/v0.1'
          assert r['parent_hardware_head'] == '5b3b4c8c77ffdbe17ad573951cca59a1c15aeb44'
          assert r['decision'] == 'SPARSE_PLUS_RECEIPT_PARETO_SUPPORTED'
          assert r['functional_gate'] is True
          assert r['sparse_low_activity_gate'] is True
          assert r['simulation']['sequences'] == 320
          assert r['simulation']['accepted_ticks'] == 3840
          assert r['receipt']['missing_receipts'] == 0
          assert r['receipt']['duplicate_receipts'] == 0
          assert r['receipt']['phantom_receipts'] == 0
          assert r['receipt']['field_match_fraction'] == 1.0
          assert r['stress']['fingerprint'] == 'sha256:be033839531356f0695b6c270b8d22a2abb8f388dd1ecb9c4b93644c9b291110'
          assert r['stress']['total_transitions'] == 16848
          assert r['execution_work']['0.01']['pe_evaluation_reduction'] >= 0.50
          assert r['execution_work']['0.05']['pe_evaluation_reduction'] >= 0.50
          assert r['execution_semantic_contamination'] == 0
          assert r['cryptographic_commitment_generated_in_hw'] is False
          assert r['synthetic_combined_score_used'] is False
          assert r['timing_decisive'] is False
          for system in ('dense','sparse','dense_receipt','sparse_receipt'):
              row = r['synthesis'][system]
              assert row['core_cells_excluding_io'] > 0
              assert row['ff'] > 0
              assert row['logic_depth_proxy'] > 0

          lines = [
              '## COSMIC-HW-07 hosted evidence',
              '',
              f"Exact candidate head: `{__import__('os').environ['GITHUB_SHA']}`",
              '',
              f"decision=`{r['decision']}`",
              f"sequences={r['simulation']['sequences']}",
              f"accepted_ticks={r['simulation']['accepted_ticks']}",
              f"checks={r['simulation']['checks']}",
              f"receipts={r['simulation']['receipts_emitted']}",
              f"batch_fifo_writes={r['simulation']['batch_fifo_writes']}",
              f"batch_fifo_reads={r['simulation']['batch_fifo_reads']}",
              f"serializer_active_cycles={r['simulation']['serializer_active_cycles']}",
              f"physical_cycles={r['simulation']['physical_cycles']}",
              '',
              'Backpressure stalls by workload:',
          ]
          for key, value in r['simulation']['backpressure_stalls_by_group'].items():
              lines.append(f"- {key}: {value}")
          lines += ['', 'Maximum reserved batch occupancy:']
          for key, value in r['simulation']['max_reserved_batch_occupancy_by_group'].items():
              lines.append(f"- {key}: {value}/4")
          lines += ['', 'Enabled PE reduction:']
          for key in ('0.01','0.05','0.20','1.00'):
              row = r['execution_work'][key]
              lines.append(
                  f"- activity {key}: {row['dense_pe_evaluations']} -> {row['sparse_pe_evaluations']} "
                  f"({row['pe_evaluation_reduction']*100:.2f}% reduction)"
              )
          lines += ['', 'Xilinx-7 structural mapping proxy:']
          for system in ('dense','sparse','dense_receipt','sparse_receipt'):
              row = r['synthesis'][system]
              lines.append(
                  f"- {system}: LUT={row['lut']} FF={row['ff']} core_cells={row['core_cells_excluding_io']} "
                  f"depth={row['logic_depth_proxy']} BRAM={row['bram']} LUTRAM={row['lutram']}"
              )
          lines += [
              '',
              'Receipt path: 40-bit deterministic transition facts, 4-entry finite batch FIFO, one valid/ready output lane.',
              'Boundary: no SHA/Merkle hardware, board power, post-route Fmax, ASIC PPA or full-stack proof claim.'
          ]
          Path('/tmp/cosmic_hw_07_evidence.md').write_text('\n'.join(lines))
          PY

      - name: Upload machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-hw-07-result
          path: /tmp/cosmic_hw_07_result.json
          if-no-files-found: ignore

      - name: Publish hosted evidence to issue 73
        if: success() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/cosmic_hw_07_evidence.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 73,
              body
            });

      - name: Publish hosted RED to issue 73
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 73,
              body: `## COSMIC-HW-07 hosted RED\n\nExact candidate head: \`${context.sha}\`\n\nThe frozen receipt RTL workload failed before a valid verdict. Do not alter the frozen stress corpus, FIFO depth, receipt width, ready patterns, or acceptance gates to force a PASS.`
            });
